[project]
name = "sshconfig"
version = "2.3"
description = "SSH config file generator"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "GPL-3.0-or-later"
authors = [
    {name="Ken Kundert", email="sshconfig@nurdletech.com"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities"
]
requires-python = ">=3.6"
keywords = ["ssh"]
dependencies = [
    "appdirs",
    "arrow",
    "docopt",
    "inform",
    "shlib",
    "requests"
]

[project.scripts]
sshconfig = "sshconfig.main:main"

[project.urls]
Homepage = "https://sshconfig.readthedocs.io"
Download = "https://github.com/kenkundert/sshconfig/tarball/master"

[build-system]
requires = ["flit_core >=2"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
addopts = "--tb=short"

[tool.ruff]
exclude = [".tox", "doc", ".diffs"]

[tool.ruff.lint]
select = ["F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"sshconfig/__init__.py" = ["F401"]
